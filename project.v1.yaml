# Fiche d'état du projet — autorité de l'état depuis ADR-0020 (design §6.2).
# La section statut du README est générée depuis cette fiche (sentinelles).
schema_version: libre-ai.project.v1
project: orchestrator
repository: libre-ai/orchestrator
kind: satellite
layer: couche-2
statement:
  for: "les surfaces qui pilotent des agents et doivent pouvoir justifier, après coup, chaque décision de démarrage, de pause, d'annulation ou de dépassement de budget"
  who_faces: "des décisions de contrôle prises au milieu du code qui les exécute : impossibles à rejouer sans effet de bord, impossibles à tester sans lancer une mission, et impossibles à opposer à quelqu'un une fois la course terminée"
  enables: "séparer décider d'agir : la décision est une fonction pure, rejouable et testable sur des identifiants opaques, et l'effet reste au dehors, chez l'appelant"
  producing:
    - "parse_control_document et evaluate_control — un verdict sur une commande orchestrator-control.v1 : effet admis, reçu de rejeu idempotent qui ne répète jamais l'effet enregistré, ou refus à code stable qui ne reflète jamais la valeur rejetée"
    - "evaluate_budget_event — l'admission d'un événement causal contre les plafonds liés au plan, ou un refus nommé (plan-budget-exceeded, plan-identity-mismatch, causal-store-unavailable)"
    - "tools/review — des passes de revue par rôle rejouables contre un commit immuable, verdict machine validé par schéma, worktrees retirés en finally"
  without_depending_on:
    - "aucun effet propre à la crate : ni processus, ni fichier, ni socket, ni secret — frontière rendue exécutable par verification/agent-orchestrator/check-capabilities.ts"
    - "aucun service tiers : les types de contrats et les vecteurs d'événements viennent de git-deps intra-org épinglées par SHA"
summary: "Cœur de décision d'orchestration d'agents — crate Rust sans effet — et outillage de revue en éventail à worktrees auto-nettoyés."
current_situation: >-
  Née verte en γ 3.4 (crate + tools/review + preuve + 3 docs d'application couche 2).
scope:
  - "API publique garantie de la crate libre-ai-agent-orchestrator (src/lib.rs) — contrôle : les fonctions parse_control_document, evaluate_control, evaluate_simulated_effect et command_fingerprint, et les types ControlCommand, ControlAction, ControlDecision, ControlApplication, ControlEffect, ControlPhase, ControlRefusal, RunControlState, StartPreflight, CommandReceipt, CommandCollisionObservation et SimulatedEffectDecision."
  - "API publique garantie — budget : la fonction evaluate_budget_event et les types PlanBudgetLimits, BudgetDecision et EventStoreObservation."
  - "Stabilité déclarée : aucune. La crate est en 0.1.0, publish = false, consommée en git-dep Cargo épinglée par rev ; une rupture voyage par montée de rev chez le consommateur. Les codes rendus par ControlRefusal::code, ControlDecision::code, SimulatedEffectDecision::code et BudgetDecision::code (orchestrator.control.*, orchestrator.effect.*, plan-budget-exceeded…) sont épinglés de fait par les consommateurs qui les lisent comme chaînes : ils font partie de la surface à couvrir. Le critère compat-policy de la phase « service » est ce qui rendra cette stabilité opposable."
  - "Décision de contrôle : validation des documents orchestrator-control.v1 par le registre de contrats verrouillé, sans refléter la valeur rejetée ; liaisons d'identité exactes entre run, tenant, mission, plan et autorisation ; faits de préflight faisant autorité avant d'accorder l'allocation d'un identifiant de run ; panne de magasin explicite, autorisation révoquée, révision périmée, annulation monotone, et rejeu idempotent rendu comme reçu."
  - "Décision de budget : arithmétique d'événements causaux et plafonds liés au plan, évalués contre l'état accepté que l'appelant présente — et refus explicite lorsque ce magasin est déclaré indisponible."
  - "tools/review : éventail de revue par rôle contre un commit immuable, lots parallèles, déduplication, verdict machine validé par schéma, et retrait des worktrees en finally — le modèle de nettoyage de référence pour la flotte."
  - "Hors périmètre : la crate est un cœur pur — elle ne possède ni registre d'événements, ni processus, ni système de fichiers, ni réseau, ni variable d'environnement, ni secret, ni persistance, ni bac à sable, ni harnais, ni adaptateur de fournisseur. La frontière n'est pas une intention : check-capabilities.ts liste la surface de dépendances admise et rejette tout import ou point d'entrée capable d'un effet système."
non_goals:
  - "Exécuter ce qu'elle autorise : la crate n'ouvre ni processus, ni fichier, ni socket ; l'appelant détient le registre d'événements, l'effet et la responsabilité de les appliquer."
  - "Tenir l'état accepté : evaluate_budget_event juge un événement contre un état que l'appelant lui présente, et refuse fermé quand ce magasin est déclaré indisponible plutôt que de supposer une valeur."
  - "Prétendre à une conformité d'exécution : les tests n'emploient que des identifiants opaques synthétiques et ne démarrent aucune mission — un harnais et des revues à rôles séparés restent obligatoires avant tout effet réel (frontière WP-G2-A01)."
  - "Fournir le harnais, l'adaptateur de fournisseur ou le bac à sable : ils sont hors de ce dépôt, et check-capabilities.ts échoue si l'un d'eux entre."
  - "Promouvoir le schéma de verdict review-verdict.v0.1 au rang de contrat : il reste côté outil tant qu'un second producteur n'émet pas la forme."
dependencies:
  - on: libre-ai/sdk-rs
    why: "types de contrats Rust et validateur d'événements causaux verrouillé — git-dep Cargo intra-org sous [sources.allow-org] ; une évolution de contrat est une montée de rev"
    pinned: "git+https://github.com/libre-ai/sdk-rs?rev=02214613c5cb0549d0618484d9b479c4cfb3c7ce"
  - on: libre-ai/contracts
    why: "vecteurs d'événements verrouillés rejoués par tests/locked_event_vectors.rs (bun install précède cargo test)"
    pinned: "github:libre-ai/contracts#ee144f03cf7d3deeda02a9fcd5e10377c2e99cb4"
  - on: libre-ai/envelope
    why: "K3 : tools/review emballe les preuves partagées en enveloppe d'intégrité et les rend gardées avant de les faire lire à un modèle de revue"
    pinned: "github:libre-ai/envelope#ad0e1a6d014ee531dd1938ed04c6b678c605dc9c"
  - on: libre-ai/governance
    why: "gabarit de gates consommé en workflows réutilisables et git-dep d'outillage — jamais dupliqué"
    pinned: "github:libre-ai/governance#4fd6e18346672189d3053e07c196c77d127e608d"
maturity: usable
confidence: medium
exposure: spec-published
freshness:
  last_verified_on: "2026-07-30"
scope_stability: stable
benchmark:
  none: "n/a (shared brick, no external parity target)"
phases:
  - id: service
    title: En service dans la constellation
    exit_criteria:
      - id: consumed-pinned
        text: "La crate et tools/review sont verts ; le modèle de worktrees auto-nettoyés est la référence de flotte."
        weight: 1
        status: accepted
        evidence:
          date: "2026-07-29"
          reference: "gate-acceptance-log 2026-07-29 (ligne 3.4), PRs hub #279-#283"
      - id: compat-policy
        text: >-
          La rupture est mécanique sur les deux surfaces que les consommateurs épinglent : les
          symboles réexportés par src/lib.rs, et les codes de refus rendus par ControlRefusal::code,
          ControlDecision::code, SimulatedEffectDecision::code et BudgetDecision::code — un consommateur qui
          teste orchestrator.control.stale-revision casse sans qu'aucune signature ne bouge.
          Artefacts versionnés : un instantané de la surface publique et la liste exhaustive de ces
          codes. Commande : cargo test --locked. Seuil : la commande échoue si un symbole disparaît,
          est ajouté ou change de signature, ou si un code disparaît ou change de valeur, sans
          montée conjointe de la version de la crate et entrée au journal des ruptures. Fermé le
          jour où les deux ruptures, rejouées séparément, font échouer la commande.
        weight: 1
        status: pending
